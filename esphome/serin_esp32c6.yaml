substitutions:
  name: serin
  friendly_name: "Serin"
  max_links: "1"
  # remote_temp_sensor: sensor.my_room_temperature  # Uncomment and set if using remote_temp

# The Serin Link is its own device in Home Assistant. ESPHome compiles
# sub-devices in from this list (serin_link cannot add one when a Link pairs),
# and link_devices: puts the Link's entities on it. One device per max_links.
esphome:
  devices:
    - id: link1
      name: "Serin Link 1"

# The Link shows an airflow direction control only for a vane select that is
# bound to it. The ids are added here rather than in common/cn105.yaml because
# the site's YAML generator writes its own ids onto that file's selects.
climate:
  - id: !extend hp
    vertical_vane_select:
      id: vane_v
    horizontal_vane_select:
      id: vane_h

serin_link:
  link_devices: [link1]
  vane_v_select: vane_v
  vane_h_select: vane_h

logger:
  level: INFO

api:

ota:
  - platform: esphome

dashboard_import:
  package_import_url: github://Serin-Labs/serin-cn105/esphome/serin_esp32c6.yaml
  import_full_config: false

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome@29133a9b84d826f6a6e9a3025f9c556460b0e0f8
  - source: github://Serin-Labs/serin-link-core@290f2a6d8946bed179231559800f8d5f742bc6f4
    components: [serin_link]

packages:
  esp32c6: !include common/esp32c6.yaml
  cn105: !include common/cn105.yaml
  wifi: !include common/wifi.yaml
  web_server: !include common/web_server.yaml
  bluetooth_proxy: !include common/bluetooth_proxy.yaml

  # To enable remote temperature sensor, uncomment the line below and set remote_temp_sensor above
  # remote_temp: !include common/remote_temp.yaml
