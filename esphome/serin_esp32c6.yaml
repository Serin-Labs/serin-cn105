substitutions:
  name: serin
  friendly_name: "Serin"
  max_links: "1"
  # remote_temp_sensor: sensor.my_room_temperature  # Uncomment and set if using remote_temp

logger:
  level: INFO

api:

ota:
  - platform: esphome

dashboard_import:
  package_import_url: github://Serin-Labs/serin-cn105/esphome/serin_esp32c6.yaml
  import_full_config: false

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome@29133a9b84d826f6a6e9a3025f9c556460b0e0f8
  - source: github://Serin-Labs/serin-link-core@93bf46ffc6b63bba020d01e80e5e0bb4573906d5
    components: [serin_link]

packages:
  esp32c6: !include common/esp32c6.yaml
  cn105: !include common/cn105.yaml
  wifi: !include common/wifi.yaml
  web_server: !include common/web_server.yaml
  bluetooth_proxy: !include common/bluetooth_proxy.yaml

  # To enable remote temperature sensor, uncomment the line below and set remote_temp_sensor above
  # remote_temp: !include common/remote_temp.yaml
