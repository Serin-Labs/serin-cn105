# ESPHome Firmware Release
#
# Builds ESPHome firmware for all supported boards and commits
# merged binaries to firmware/esphome/ for ESP Web Tools flashing.
#
# The matrix below is the only place a board is declared. Each build job emits
# a manifest fragment beside its binary and the validation job merges them, so
# adding a board is one matrix entry rather than an entry plus a copy line plus
# a hand-written manifest stanza that can disagree with both.
#
# Triggers:
#   - All pull requests targeting main (build and validate only)
#   - Push to configs, build dependencies, or this workflow on main
#   - Manual dispatch (publication only from main)

name: ESPHome Firmware Release

on:
  # A required PR check must run even when only unrelated files changed.
  pull_request:
    branches:
      - main
  push:
    paths:
      - 'esphome/**'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'requirements-idf.lock'
      - 'scripts/check-esphome-packages.py'
      - 'scripts/check-python-lock.py'
      - 'scripts/check-esphome-workflow.mjs'
      - '.github/workflows/esphome-firmware.yml'
    branches:
      - main
  workflow_dispatch:

# Serialize publication on main. Superseded PR checks can be cancelled without
# sharing a group with releases or other PRs.
concurrency:
  group: esphome-firmware-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: esphome/serin_esp32s3.yaml
            name: m5atoms3lite
            board: m5atoms3-lite
            family: ESP32-S3
            chip: esp32s3
            flash_size: 8MB
          - config: esphome/serin_esp32c6.yaml
            name: nanoc6
            board: nanoc6
            family: ESP32-C6
            chip: esp32c6
            flash_size: 4MB

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-idf.lock

      - name: Install ESPHome
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Compile firmware
        env:
          CONFIG: ${{ matrix.config }}
          # IDF has a separate Python environment. A fresh prefix ensures an
          # old stamped installation cannot bypass the committed constraints.
          ESPHOME_ESP_IDF_PREFIX: ${{ runner.temp }}/esphome-idf
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements-idf.lock
        run: |
          python scripts/check-esphome-packages.py
          esphome compile "$CONFIG"
          python scripts/check-python-lock.py requirements-build.txt
          idf_python=( "${ESPHOME_ESP_IDF_PREFIX}"/penvs/*/bin/python )
          test "${#idf_python[@]}" -eq 1
          "${idf_python[0]}" scripts/check-python-lock.py requirements-idf.lock

      - name: Find build artifacts
        id: build-dir
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          # ESPHome creates .esphome/ in the config file's directory
          CONFIG_DIR=$(dirname "$CONFIG")
          BUILD_ROOT="${CONFIG_DIR}/.esphome/build"

          echo "=== All .bin files under ${BUILD_ROOT} ==="
          find "$BUILD_ROOT" -name "*.bin" -type f

          BOOTLOADER=$(find "$BUILD_ROOT" -name "bootloader.bin" -type f | head -1)
          PARTITIONS=$(find "$BUILD_ROOT" \( -name "partition-table.bin" -o -name "partitions.bin" \) -type f | head -1)
          # Try "firmware.bin" (PlatformIO) first, then device-named bin (native ESP-IDF)
          FIRMWARE=$(find "$BUILD_ROOT" -name "firmware.bin" -type f | head -1)
          if [ -z "$FIRMWARE" ]; then
            DEV_DIR=$(find "$BUILD_ROOT" -maxdepth 1 -mindepth 1 -type d | head -1)
            DEVICE_NAME=$(basename "$DEV_DIR")
            FIRMWARE=$(find "$DEV_DIR" -maxdepth 2 -name "${DEVICE_NAME}.bin" -type f | head -1)
          fi

          if [ -z "$BOOTLOADER" ] || [ -z "$PARTITIONS" ] || [ -z "$FIRMWARE" ]; then
            echo "::error::Missing build artifacts: bootloader=${BOOTLOADER} partitions=${PARTITIONS} firmware=${FIRMWARE}"
            exit 1
          fi

          echo "bootloader=${BOOTLOADER}" >> "$GITHUB_OUTPUT"
          echo "partitions=${PARTITIONS}" >> "$GITHUB_OUTPUT"
          echo "firmware=${FIRMWARE}" >> "$GITHUB_OUTPUT"
          echo "Found: bootloader=${BOOTLOADER} partitions=${PARTITIONS} firmware=${FIRMWARE}"

      - name: Create merged firmware binary
        env:
          CHIP: ${{ matrix.chip }}
          NAME: ${{ matrix.name }}
          FLASH_SIZE: ${{ matrix.flash_size }}
          BOOTLOADER: ${{ steps.build-dir.outputs.bootloader }}
          PARTITIONS: ${{ steps.build-dir.outputs.partitions }}
          FIRMWARE: ${{ steps.build-dir.outputs.firmware }}
        run: |
          esptool --chip "${CHIP}" merge-bin \
            -o "${NAME}.bin" \
            --flash-mode dio --flash-freq 80m --flash-size "${FLASH_SIZE}" \
            0x0000 "${BOOTLOADER}" \
            0x8000 "${PARTITIONS}" \
            0x10000 "${FIRMWARE}"

      # The build that produced the binary is the only thing that knows its
      # hash and which chip it is for, so it writes that down here rather than
      # the deploy job restating it.
      - name: Describe build
        env:
          NAME: ${{ matrix.name }}
          BOARD: ${{ matrix.board }}
          FAMILY: ${{ matrix.family }}
        run: |
          jq -n \
            --arg family "$FAMILY" \
            --arg board "$BOARD" \
            --arg sha "$(sha256sum "${NAME}.bin" | cut -d' ' -f1)" \
            --arg path "${NAME}.bin" \
            '{chipFamily: $family, board: $board, sha256: $sha, parts: [{path: $path, offset: 0, sha256: $sha}]}' \
            > "${NAME}.json"
          cat "${NAME}.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.name }}.bin
            ${{ matrix.name }}.json

  validate:
    name: ESPHome validation
    needs: build
    # A failed dependency must make this required check fail, not be skipped.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Both board builds must succeed; build result: ${BUILD_RESULT}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up workflow checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check workflow guards
        env:
          WORKFLOW_TEST_MODULES: ${{ runner.temp }}/workflow-check/node_modules
        run: |
          npm install --prefix "${RUNNER_TEMP}/workflow-check" --ignore-scripts --no-audit --no-fund \
            @actions/expressions@0.3.61 yaml@2.9.1
          node scripts/check-esphome-workflow.mjs

      - name: Set up validation tools
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt

      - name: Install validation tools
        run: python -m pip install -r scripts/requirements-validation.txt

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts/

      - name: Stage candidate firmware
        run: |
          set -euo pipefail
          rm -f firmware/esphome/*.bin
          cp artifacts/firmware-*/*.bin firmware/esphome/
          ls -l firmware/esphome/

      # Built from the fragments the build jobs wrote, so the manifest lists
      # exactly the boards that were compiled — never a board the matrix
      # dropped or one whose binary failed to copy.
      - name: Generate manifest.json
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^esphome==//p' requirements.txt)
          test -n "$VERSION"
          jq -s --arg version "$VERSION" \
            '{name: "Serin ESPHome", version: $version, builds: .}' \
            artifacts/firmware-*/*.json > firmware/esphome/manifest.json
          cat firmware/esphome/manifest.json

      - name: Validate manifest
        run: python3 scripts/validate-manifests.py

      - name: Upload validated firmware
        uses: actions/upload-artifact@v7
        with:
          name: validated-esphome
          path: firmware/esphome/
          if-no-files-found: error

  deploy:
    needs: validate
    if: >-
      ${{ needs.validate.result == 'success' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create distribution token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SERIN_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.SERIN_PUBLISHER_PRIVATE_KEY }}
          owner: Serin-Labs
          repositories: serin-cn105
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.publisher-token.outputs.token }}

      - name: Set up validation tools
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt

      - name: Install validation tools
        run: python -m pip install -r scripts/requirements-validation.txt

      - name: Download validated firmware
        uses: actions/download-artifact@v8
        with:
          name: validated-esphome
          path: artifacts/esphome/

      - name: Stage and validate publication
        run: |
          set -euo pipefail
          rm -f firmware/esphome/*.bin
          cp artifacts/esphome/* firmware/esphome/
          python3 scripts/validate-manifests.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware/esphome/
          git diff --staged --quiet && { echo "No firmware change."; exit 0; }
          git commit -m "chore: update esphome firmware binaries"
          # The concurrency group serializes this workflow against itself, but
          # a HomeKit or Matter release can land on main at the same moment.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt ${attempt}); rebasing onto main."
            git pull --rebase origin main
            # The rebase changes the candidate tree. Check it before retrying
            # publication, including files from other producers.
            python3 scripts/validate-manifests.py
          done
          exit 1
