# Manifest Validation
#
# This repo is read straight from `main` by the web installer and by every
# Serin Link doing an OTA check, so a manifest naming a file that is not there
# is a broken install the moment it lands. ESPHome, HomeKit and Matter publish
# with the Serin Firmware Publisher App; its pushes trigger this validation.
# Each producer also validates the candidate files before pushing them.

name: Validate manifests

on:
  push:
    paths:
      - 'firmware/**'
      - 'scripts/**'
      - '.github/workflows/validate-manifests.yml'
      - '.github/workflows/esphome-firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'scripts/**'
      - '.github/workflows/validate-manifests.yml'
      - '.github/workflows/esphome-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt

      - name: Install validation tools
        run: python -m pip install -r scripts/requirements-validation.txt

      - name: Test manifest validation
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate manifests
        run: python3 scripts/validate-manifests.py

      # Firmware images do not delta-compress, so history grows by roughly the
      # size of every release forever. Nothing is wrong at the current size;
      # this exists so the decision to move binaries to release assets arrives
      # on a schedule instead of as a surprise. See README "Building".
      - name: Check repository size
        run: |
          set -euo pipefail
          SIZE=$(git count-objects -v | awk '/^size-pack:/ {print int($2 / 1024)}')
          echo "Pack size: ${SIZE} MB"
          if [ "$SIZE" -ge 250 ]; then
            echo "::warning::Pack is ${SIZE} MB — time to revisit binary hosting."
          fi
